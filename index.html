<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downtown Pizzeria - Order Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <form action="#" method="post">

            <fieldset>

                <legend>Customer Information</legend>
                <div class="form-grid">

                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required minlength="2" placeholder="Colin Crab">

                    <label for="address">Address:</label>
                    <input type="text" id="address" name="address" required placeholder="123 Crab Nebula">

                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone" required pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                        placeholder="123-456-7890">

                </div>
            </fieldset> change




            <fieldset>
                <legend>The Order</legend>
                <div class="form-grid">


                    <label>Crust:</label>
                    <div class="flex-row option-group">

                        <label for="thin">
                            <input type="radio" id="thin" name="crust" value="thin" required>
                            Thin
                        </label>

                        <label for="classic">
                            <input type="radio" id="classic" name="crust" value="classic">
                            Classic
                        </label>

                        <label for="deep-dish">
                            <input type="radio" id="deep-dish" name="crust" value="deep-dish">
                            Deep Dish
                        </label>
                    </div>



                    <label>Toppings:</label>
                    <div class="flex-row toppings">
                        <label for="pepperoni">
                            <input type="checkbox" id="pepperoni" name="toppings" value="pepperoni">
                            Pepperoni
                        </label>

                        <label for="mushroom">
                            <input type="checkbox" id="mushroom" name="toppings" value="mushroom">
                            Mushroom
                        </label>

                        <label for="olives">
                            <input type="checkbox" id="olives" name="toppings" value="olives">
                            Olives
                        </label>

                        <label for="green-peppers">
                            <input type="checkbox" id="green-peppers" name="toppings" value="green-peppers">
                            Green Peppers
                        </label>

                        <label for="extra-cheese">
                            <input type="checkbox" id="extra-cheese" name="toppings" value="extra-cheese">
                            Extra Cheese
                        </label>
                    </div>


                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" name="quantity" min="1" max="10" required placeholder="1">
                </div>
            </fieldset>




            <fieldset>
                <legend>Delivery and Payment</legend>
                <div class="form-grid"></div>

                <label for="instructions">Delivery Instructions:</label>
                <textarea id="instructions" name="instructions" placeholder="Optional delivery instructions"></textarea>

                <label for="delivery-date">Delivery Date and Time:</label>
                <input type="datetime-local" id="delivery-date" name="delivery-date" min="2026-10-05T00:00" required>

                <label for="payment">Payment Method:</label>
                <select id="payment" name="payment" required>
                    <option value="">Select a payment method</option>
                    <option value="cash">Cash</option>
                    <option value="card">Card</option>
                    <option value="debit">Debit</option>
                </select>

                </div>
            </fieldset>

            <div class="button-row">
                <button type="submit">Place Order</button>
                <button type="reset">Reset</button>
            </div>

        </form>



        <aside>
            <h2>Your Order</h2>

            <div class="table-wrapper">
                <table>
                    <caption>Order Summary</caption>

                    <thead>
                        <tr>
                            <th scope="col">Item</th>
                            <th scope="col">Details</th>
                            <th scope="col">Price</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Base Pizza</td>
                            <td>Large (12"), Thin crust</td>
                            <td>$16.99</td>
                        </tr>

                        <tr>
                            <td>Toppings</td>
                            <td>Mushrooms, Olives, Extra cheese</td>
                            <td>$4.50</td>
                        </tr>

                        <tr>
                            <td>Delivery Fee</td>
                            <td>Standard delivery</td>
                            <td>$3.99</td>
                        </tr>
                    </tbody>


                    <tfoot>
                        <tr>
                            <th scope="row" colspan="2">Total</th>
                            <td>$25.48</td>
                        </tr>
                    </tfoot>


                </table>
            </div>
        </aside>

    </main>

</body>

</html>
